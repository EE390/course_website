name: Site checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    name: Pages, links, files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Required page tags, identical navigation, internal links and #anchors,
      # examples list, every download linked, file-size limits, no instructor files.
      - name: Run site checks
        run: python .github/scripts/check_site.py

  c-code:
    name: C code compiles (SDCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDCC
        run: sudo apt-get update && sudo apt-get install -y sdcc
      - name: Compile every C example and starter without warnings
        shell: bash
        run: |
          sdcc --version
          shopt -s nullglob
          status=0
          for f in examples/c/*.c files/starters/*.c; do
            out=$(mktemp -d)
            log=$(sdcc -mmcs51 -o "$out/" "$f" 2>&1) || { echo "::error file=$f::build failed"; echo "$log"; status=1; continue; }
            if echo "$log" | grep -qi "warning"; then
              echo "::error file=$f::compiler warnings"; echo "$log"; status=1
            else
              echo "ok  $f"
            fi
          done
          exit $status

  simulator:
    name: Lab simulator (assembler + CPU model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Assembles every example and compares the bytes with ASEM-51's output,
      # then runs each program and compares against the Python emulator's trace.
      - name: Run simulator tests
        run: node .github/tests/run-tests.js
